<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>どんぐりあつめ 🌰</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div class="sky-bg">
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>

    <div class="grass-decoration">
      <div class="hill hill-left"></div>
      <div class="hill hill-right"></div>
    </div>

    <header class="page-header">
      <div class="header-acorn header-acorn-left" aria-hidden="true">🌰</div>
      <h1 class="game-title">
        <span class="title-line">どんぐり</span>
        <span class="title-line title-line-accent">あつめ</span>
      </h1>
      <div class="header-acorn header-acorn-right" aria-hidden="true">🌰</div>
    </header>

    <main class="game-wrapper">
      <div id="unity-container" class="unity-desktop">
        <div class="game-frame">
          <canvas id="unity-canvas"></canvas>
        </div>

        <div id="unity-loading-bar">
          <div class="loading-content">
            <div class="loading-acorn" aria-hidden="true">
              <svg viewBox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="32" cy="58" rx="22" ry="20" fill="#C87840"/>
                <ellipse cx="32" cy="58" rx="18" ry="16" fill="#E8A060"/>
                <path d="M18 38 Q32 10 46 38 Q40 32 32 32 Q24 32 18 38" fill="#6B9B4A"/>
                <ellipse cx="32" cy="36" rx="16" ry="10" fill="#7CB356"/>
                <circle cx="26" cy="54" r="3" fill="#F5D5A8" opacity="0.5"/>
              </svg>
            </div>
            <p class="loading-text">よみこみちゅう…</p>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
            <p class="loading-percent" id="loading-percent">0%</p>
          </div>
        </div>

        <div id="unity-footer">
          <button id="unity-fullscreen-button" type="button" aria-label="全画面表示" title="全画面表示">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 9V4H9M15 4H20V9M20 15V20H15M9 20H4V15" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
    </main>

    <footer class="page-footer">
      <p>🍂 どんぐりを あつめよう！ 🍂</p>
    </footer>

    <script>
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/release.loader.js";
      var config = {
        dataUrl: buildUrl + "/release.data",
        frameworkUrl: buildUrl + "/release.framework.js",
        codeUrl: buildUrl + "/release.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Don-Guri",
        productVersion: "1.0",
      };

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var loadingPercent = document.querySelector("#loading-percent");
      var fullscreenButton = document.querySelector("#unity-fullscreen-button");

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        container.className = "unity-mobile";
        config.devicePixelRatio = 1;
      } else {
        canvas.style.width = "600px";
        canvas.style.height = "800px";
      }
      loadingBar.style.display = "flex";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          var percent = Math.round(100 * progress);
          progressBarFull.style.width = percent + "%";
          loadingPercent.textContent = percent + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          fullscreenButton.onclick = () => {
            unityInstance.SetFullscreen(1);
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
